name: Deploy editor

# Owner decisions (2026-10-21, erp-saas D-212, D-213): the editor is static files served by nginx on the company's
# Hostinger VPS (CloudPanel "Static HTML" site editor.jrmconstruction.org). It deploys automatically on every push to
# main that changes the editor, and by "Run workflow" for a rollback. It runs the verify harnesses, builds dist/,
# then asks the server's receiver (jrm-editor-receive, the only thing the deploy key may run; no shell) to store it
# as releases/<sha> and switch the site's `current` link to it in one step. The last 5 releases stay on the server.
# Rollback: run it with "rollback_to" = an earlier release's full commit SHA (no build; the link switches back).
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   EDITOR_HOST = editor.jrmconstruction.org
#   DEPLOY_USER = jrmconstruction-editor          (the CloudPanel site user)
# (the site folder is fixed on the server, in authorized_keys; CloudPanel's Root Directory is <domain>/current)
# Secrets: EDITOR_SSH_HOST, EDITOR_SSH_KEY, EDITOR_SSH_KNOWN_HOSTS.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/deploy-editor.yml'
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Switch back to an earlier release (its commit SHA) instead of building; empty = build this branch"
        type: string
        default: ""

# Releases never overlap; a switch is one rename, so finishing an older run first is harmless.
concurrency:
  group: deploy-editor
  cancel-in-progress: false

permissions:
  contents: read

env:
  EDITOR_HOST: ${{ vars.EDITOR_HOST }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}
  ROLLBACK_TO: ${{ inputs.rollback_to }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: editor
    steps:
      - name: Settings
        id: release
        run: |
          for v in EDITOR_HOST DEPLOY_USER; do
            [ -n "${!v}" ] || { echo "Set the $v repository variable." >&2; exit 1; }
          done
          if [ -n "$ROLLBACK_TO" ]; then
            # The value reaches a remote shell: accept only a commit SHA.
            [[ "$ROLLBACK_TO" =~ ^[0-9a-f]{40}$ ]] || { echo "rollback_to must be a full 40-character commit SHA." >&2; exit 1; }
            echo "sha=$ROLLBACK_TO" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: inputs.rollback_to == ''
      - uses: actions/setup-node@v4
        if: inputs.rollback_to == ''
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: inputs.rollback_to == ''
        run: npm ci
      - name: Quality gate (verify harnesses)
        if: inputs.rollback_to == ''
        run: |
          # verify-legacy-shim is a dated reminder (KD-31: the legacy accessors' removal date passed), not a test of
          # behaviour; it is reported here and never blocks. Every other harness must pass.
          failed=""
          for f in scripts/verify-*.mjs; do
            name="$(basename "$f")"
            if node --experimental-loader ./scripts/resolver-hook.mjs "$f" > "/tmp/$name.log" 2>&1; then
              echo "pass  $name"
            elif [ "$name" = "verify-legacy-shim.mjs" ]; then
              echo "note  $name (KD-31 reminder, not blocking)"
            else
              echo "FAIL  $name"; tail -20 "/tmp/$name.log"; failed="$failed $name"
            fi
          done
          [ -z "$failed" ] || { echo "Failing harnesses:$failed" >&2; exit 1; }
      - name: Build
        if: inputs.rollback_to == ''
        run: npm run build

      - name: SSH key and known host
        env:
          SSH_KEY: ${{ secrets.EDITOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EDITOR_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload the release
        if: inputs.rollback_to == ''
        env:
          HOST: ${{ secrets.EDITOR_SSH_HOST }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          tar -C dist -cf - . | ssh "$DEPLOY_USER@$HOST" "upload $SHA"

      - name: Switch to the release
        env:
          HOST: ${{ secrets.EDITOR_SSH_HOST }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh "$DEPLOY_USER@$HOST" "switch $SHA"

      - name: Smoke check
        run: |
          html="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://${EDITOR_HOST}/")"
          echo "$html" | grep -q 'id="root"' || { echo "The page is not the editor." >&2; exit 1; }
          asset="$(echo "$html" | grep -oE '/assets/[^"]+\.js' | head -1)"
          curl -fsS -o /dev/null "https://${EDITOR_HOST}${asset}"
          echo "Live: https://${EDITOR_HOST} (${asset})"
